plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.3'
	id 'io.spring.dependency-management' version '1.1.3'
}

group = 'com.github.milomarten'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	implementation "com.discord4j:discord4j-core:3.2.6"

	implementation 'org.apache.commons:commons-collections4:4.4'
	implementation 'org.mnode.ical4j:ical4j:4.0.3'
	implementation 'org.mnode.ical4j:ical4j-extensions:2.0.0-rc5'
	implementation 'jakarta.validation:jakarta.validation-api:3.1.0'
	implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'

	implementation 'com.github.jknack:handlebars:4.4.0'
	implementation 'com.github.jknack:handlebars-helpers:4.4.0'
	implementation 'com.github.jknack:handlebars-jackson:4.4.0'

	compileOnly 'org.projectlombok:lombok'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('jar') {
	enabled = false
}

bootJar {
	version = "local"
	if (project.hasProperty("fracktailVersion")) {
		version = project.property("fracktailVersion")
	}
	manifest {
		attributes 'Specification-Title': 'Fracktail 4'
		attributes 'Specification-Version': version
		attributes 'Specification-Vendor': 'Milo Marten'
		attributes 'Implementation-Title': 'com.github.milomarten.fracktail4'
		attributes 'Implementation-Version': version
		attributes 'Implementation-Vendor': 'Milo Marten'
	}
}
